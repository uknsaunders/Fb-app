plugins {
    id 'com.android.application'
}

android {
    namespace 'com.listinghound.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.listinghound.app'
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName '1.13'
    }

    signingConfigs {
        release {
            storeFile file('../keystore/listinghound.jks')
            storePassword 'listinghound'
            keyAlias 'listinghound'
            keyPassword 'listinghound'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
