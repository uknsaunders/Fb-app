name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/listinghound.jks
          elif [ ! -f keystore/listinghound.jks ]; then
            echo "No signing key found" && exit 1
          fi

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ListingHound-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ListingHound-apk
          path: ListingHound-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Listing Hound build ${{ github.run_number }}
          body: Tap the .apk below to download and install it on your phone.
          files: ListingHound-*.apk
          make_latest: true
